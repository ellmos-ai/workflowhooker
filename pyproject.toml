[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "workflowhooker"
version = "0.2.2"
description = "Local-first workflow checks for coding-agent lifecycle hooks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ellmos-ai contributors" }]
keywords = ["workflow", "llm-agent", "hook", "local-first"]
dependencies = [
    "hook-master @ git+https://github.com/ellmos-ai/hook-master.git@75e1aefd4c83386fb754b32579d78c2549aad732",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
workflowhooker = "workflowhooker.cli:main"

[tool.setuptools.packages.find]
include = ["workflowhooker*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
